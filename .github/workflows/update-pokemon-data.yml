name: Update Pokemon Data

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to auto-commit stat fixes
      pull-requests: write   # needed to open a PR for new Pokemon/sprites
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data refresh
        id: refresh
        run: python scripts/update_pokemon_data.py

      # Only auto-commit straight to main when EVERY change this run is a
      # plain stat correction to a Pokemon we already track. If new Pokemon
      # were also found, pokemon-mechanics.js now contains BOTH kinds of
      # edits mixed together, so the whole diff goes through the PR path
      # below instead (keeps review-required additions out of main).
      - name: Commit and push base-stat corrections
        if: steps.refresh.outputs.stat_fixes != '0' && steps.refresh.outputs.new_pokemon == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pokemon-mechanics.js
          if git diff --cached --quiet; then
            echo "No staged changes"
          else
            git commit -m "Auto-update base stats from pogoapi.net (${{ steps.refresh.outputs.stat_fixes }} correction(s)) [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), fetching and rebasing..."
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" = "5" ]; then
                echo "::error::Failed to push base-stat corrections after $attempt attempts"
                exit 1
              fi
            done
          fi

      - name: Open PR for new Pokemon / sprites
        if: steps.refresh.outputs.new_pokemon != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="new-pokemon-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add pokemon-mechanics.js data/new_pokemon.json sprites/
          if git diff --cached --quiet; then
            echo "No new Pokemon to propose"
            exit 0
          fi
          git commit -m "Add newly-detected Pokemon (dex + stats + sprite) for review"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "New Pokemon detected: review stats/sprites before merging" \
            --body "Auto-detected ${{ steps.refresh.outputs.new_pokemon }} dex number(s) present in pogoapi.net but missing from DEX_NAMES/BASE_STATS (this diff also includes ${{ steps.refresh.outputs.stat_fixes }} routine stat correction(s) found in the same run). Review data/new_pokemon.json and the fetched sprite(s) in sprites/ before merging \u2014 this is NOT auto-merged since it needs a sprite/name sanity check." \
            --base main \
            --head "$BRANCH" || echo "PR may already exist for this branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
