name: Update Pokemon Data

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read   # default for every job; a job that commits overrides it below

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to auto-commit stat fixes
      pull-requests: write   # needed to open a PR for new Pokemon/sprites
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the bundle builder's dependency
        run: npm install --no-save terser

      # Refreshes pokemon-mechanics.js and, when it changed, rebuilds the bundles that embed it (version bump included).
      - name: Run data refresh
        id: refresh
        run: scripts/refresh_pokemon_data.sh

      # Only auto-commit straight to main when EVERY change this run is a
      # plain correction to data we already track (base stats, or the CPM and
      # Power-Up tables). If new Pokemon were also found, pokemon-mechanics.js
      # now contains BOTH kinds of edits mixed together, so the whole diff goes
      # through the PR path below instead (keeps review-required additions out
      # of main). The commit carries the rebuilt bundles; if the push loses a
      # race, the helper re-runs the refresh on the latest main.
      - name: Commit and push data corrections
        if: (steps.refresh.outputs.base_stat_fixes != '0' || steps.refresh.outputs.table_fixes != '0') && steps.refresh.outputs.new_pokemon == '0'
        run: |
          scripts/ci_push.sh --regen scripts/refresh_pokemon_data.sh \
            "Auto-update Pokemon data from pogoapi.net ($IN_BASE_STAT_FIXES base-stat correction(s), $IN_TABLE_FIXES table refresh(es)) [skip ci]" \
            pokemon-mechanics.js "Scout Dashboard.dc.html" "Scout Dashboard Standalone.dc.html" "Scout Dashboard.html" index.html sw.js
        env:
          CI_PUSH_BRANCH: ${{ github.ref_name }}
          IN_BASE_STAT_FIXES: ${{ steps.refresh.outputs.base_stat_fixes }}
          IN_TABLE_FIXES: ${{ steps.refresh.outputs.table_fixes }}

      - name: Open PR for new Pokemon / sprites
        if: steps.refresh.outputs.new_pokemon != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="new-pokemon-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add pokemon-mechanics.js data/new_pokemon.json sprites/ "Scout Dashboard.dc.html" "Scout Dashboard Standalone.dc.html" "Scout Dashboard.html" index.html sw.js
          if git diff --cached --quiet; then
            echo "No new Pokemon to propose"
            exit 0
          fi
          git commit -m "Add newly-detected Pokemon (dex + stats + sprite) for review"
          git push origin "$BRANCH" --force
          gh pr create \
            --title "New Pokemon detected: review stats/sprites before merging" \
            --body "Auto-detected $IN_STEPS_REFRESH_OUTPUTS_NEW_POKEMON dex number(s) present in pogoapi.net but missing from DEX_NAMES/BASE_STATS (this diff also includes $IN_BASE_STAT_FIXES routine base-stat correction(s) and $IN_TABLE_FIXES table refresh(es) found in the same run, and the rebuilt app bundles). Review data/new_pokemon.json and the fetched sprite(s) in sprites/ before merging \u2014 this is NOT auto-merged since it needs a sprite/name sanity check." \
            --base main \
            --head "$BRANCH" || echo "PR may already exist for this branch"
        env:
          IN_STEPS_REFRESH_OUTPUTS_NEW_POKEMON: ${{ steps.refresh.outputs.new_pokemon }}
          IN_BASE_STAT_FIXES: ${{ steps.refresh.outputs.base_stat_fixes }}
          IN_TABLE_FIXES: ${{ steps.refresh.outputs.table_fixes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
