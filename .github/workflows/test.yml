name: Tests

# Runs the logic tests and a real-browser smoke render on every push and PR.
# The smoke test loads the actual index.html in headless Chromium, imports a
# small CSV, and checks the screens that have broken before (roster rows, swipe,
# long-press, detail sheet, PvP / Attackers / Raid tabs), failing on any
# uncaught page error.

on:
  push:
  pull_request:

permissions:
  contents: read   # default for every job; a job that commits overrides it below

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Logic tests
        run: |
          node scripts/test_ranking.js
          node scripts/test_roster_logic.js
          node scripts/test_rank_reference.js
          node scripts/test_pvp_sim.js
          node scripts/test_max.js
          node scripts/test_cp_recovery.js
          node scripts/test_firestore_rules.js
          node scripts/test_no_dangerous_sinks.js
          node scripts/test_tracked_tree.js
          node scripts/test_sri.js

      - name: Gemini pipeline tests
        run: |
          pip install -r requirements.txt
          python3 scripts/test_gemini_pool.py
          python3 scripts/test_extract_pipeline.py
          python3 scripts/test_postprocess.py
          python3 scripts/test_evolution_branches.py
          python3 scripts/test_tier_trends.py
          python3 scripts/test_event_moves.py
          python3 scripts/test_promo_codes.py
          python3 scripts/test_workflows.py

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Bundles match the source
        run: |
          python3 scripts/test_bundles_current.py

      - name: Content-Security-Policy over http://localhost (Chromium; WebKit runs in the QA workflow)
        run: QA_BROWSER=chromium node scripts/test_csp.js

      - name: Smoke render
        run: node scripts/smoke_render.js
