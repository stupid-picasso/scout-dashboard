name: Extract IV Ratings

# Two extraction runs pushing generated files at the same time is what
# produced the unresolvable rebase conflict; serialise them instead.
concurrency:
  group: pogo-data-commit
  cancel-in-progress: false

on:
  push:
    paths:
      - 'appraisal_videos/*.mp4'
      - 'appraisal_videos/*.mov'
  workflow_dispatch:
    inputs:
      drive_link:
        description: 'Google Drive share link to an APPRAISAL screen recording (must be set to "Anyone with the link")'
        required: false
        default: ''
      fresh_import:
        description: 'Start a clean import (reset old data/appraisal_import.json first). Set to false only to add more videos to a session already in progress.'
        required: false
        default: 'true'
      fps:
        description: 'Frames per second for extraction'
        required: false
        default: '6'
      scene_detect:
        description: 'Use scene detection instead of fixed FPS'
        required: false
        default: 'true'
      scene_threshold:
        description: 'Scene change threshold (0.0-1.0)'
        required: false
        default: '0.3'

permissions:
  contents: read   # default for every job; a job that commits overrides it below

jobs:
  extract:
    permissions:
      contents: write  # the called workflow commits the results; it can only use what this job grants
    uses: ./.github/workflows/extract-run.yml
    with:
      mode: appraisal
      drive_link: ${{ inputs.drive_link }}
      fresh_import: ${{ inputs.fresh_import || 'true' }}
      fps: ${{ inputs.fps || '6' }}
      scene_detect: ${{ inputs.scene_detect || 'true' }}
      scene_threshold: ${{ inputs.scene_threshold || '0.3' }}
    secrets:
      GEMINI_API_KEY_ONE: ${{ secrets.GEMINI_API_KEY_ONE }}
      GEMINI_API_KEY_TWO: ${{ secrets.GEMINI_API_KEY_TWO }}
