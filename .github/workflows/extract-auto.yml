name: Auto-import from Drive folder

# Checks a shared Google Drive folder for new screen recordings and runs the
# normal extraction on any it has not seen. Does nothing until the repository
# variable DRIVE_FOLDER_URL is set (Settings > Secrets and variables > Actions >
# Variables). The folder must be shared as "Anyone with the link".
concurrency:
  group: pogo-data-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  auto:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRIVE_FOLDER_URL: ${{ vars.DRIVE_FOLDER_URL }}
    steps:
      - name: Skip when no folder is configured
        if: env.DRIVE_FOLDER_URL == ''
        run: echo "DRIVE_FOLDER_URL is not set - nothing to do."

      - uses: actions/checkout@v4
        if: env.DRIVE_FOLDER_URL != ''

      - uses: actions/setup-python@v5
        if: env.DRIVE_FOLDER_URL != ''
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.DRIVE_FOLDER_URL != ''
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Download new recordings
        if: env.DRIVE_FOLDER_URL != ''
        run: |
          mkdir -p /tmp/drive_in data
          touch data/processed_drive_files.txt
          gdown --folder "$DRIVE_FOLDER_URL" -O /tmp/drive_in --remaining-ok || true
          find /tmp/drive_in -type f \( -iname '*.mp4' -o -iname '*.mov' \) | sort > /tmp/all.txt
          : > /tmp/new.txt
          while read -r f; do
            key="$(basename "$f")|$(stat -c %s "$f")"
            grep -qxF "$key" data/processed_drive_files.txt || echo "$f" >> /tmp/new.txt
          done < /tmp/all.txt
          echo "New recordings: $(wc -l < /tmp/new.txt)"

      - name: Extract new recordings
        if: env.DRIVE_FOLDER_URL != ''
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_ONE }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_TWO }}
        run: |
          [ -s /tmp/new.txt ] || exit 0
          while read -r f; do
            python pogo_extract.py --video "$f" --scene-detect --scene-threshold 0.3 --fps 6
            echo "$(basename "$f")|$(stat -c %s "$f")" >> data/processed_drive_files.txt
          done < /tmp/new.txt

      - name: Commit results
        if: env.DRIVE_FOLDER_URL != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Auto-import new recordings from Drive [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase -X theirs origin main || { git rebase --abort; git fetch origin main; git reset --soft origin/main; git commit -qm "Auto-import new recordings from Drive [skip ci]"; }
          done
