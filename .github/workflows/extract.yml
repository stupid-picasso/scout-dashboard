name: Extract Pokemon Data

# Shares a queue with Extract IV Ratings — concurrent pushes of the same
# generated files are what caused the unresolvable rebase conflict.
concurrency:
  group: pogo-data-commit
  cancel-in-progress: false

on:
  push:
    paths:
      - 'videos/*.mp4'
      - 'videos/*.mov'
  workflow_dispatch:
    inputs:
      drive_link:
        description: 'Google Drive share link to a screen recording (must be set to "Anyone with the link")'
        required: false
        default: ''
      fresh_import:
        description: 'Start a clean import (reset old data/pokemon_import.json first). Set to false only to add more videos to a session already in progress.'
        required: false
        default: 'true'
      fps:
        description: 'Frames per second for extraction'
        required: false
        default: '6'
      scene_detect:
        description: 'Use scene detection instead of fixed FPS'
        required: false
        default: 'true'
      scene_threshold:
        description: 'Scene change threshold (0.0-1.0)'
        required: false
        default: '0.3'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the auto-commit step can push its own results
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Download video from Google Drive
        if: github.event_name == 'workflow_dispatch' && inputs.drive_link != ''
        run: |
          mkdir -p /tmp/drive_video
          gdown "${{ inputs.drive_link }}" -O /tmp/drive_video/clip.mp4
          echo "DRIVE_VIDEO_PATH=/tmp/drive_video/clip.mp4" >> $GITHUB_ENV

      - name: Check for videos
        id: check_videos
        run: |
          video_count=$(find videos/ -type f \( -name '*.mp4' -o -name '*.mov' \) | wc -l)
          echo "count=$video_count" >> $GITHUB_OUTPUT
          echo "Found $video_count video(s) in videos/"
          if [ -n "$DRIVE_VIDEO_PATH" ]; then
            echo "Plus one Drive-downloaded video: $DRIVE_VIDEO_PATH"
          fi

      # Wipes data/pokemon_import.json before this session's videos are
      # processed, so old sessions never linger. Runs once per job, before
      # any video is processed, so every video in THIS session (repo videos/
      # and a Drive-link video alike, whether one or several) still merges
      # together normally afterward — only past sessions get cleared.
      # Skipped when fresh_import is explicitly 'false' (continuing a
      # session already in progress across separate workflow runs). Missing
      # on a push trigger (no `inputs` there) reads as unset, not 'false', so
      # push-triggered runs default to fresh too.
      - name: Reset import file for a clean session
        if: github.event.inputs.fresh_import != 'false'
        run: |
          mkdir -p data
          rm -f data/pokemon_import.json
          echo "Cleared data/pokemon_import.json — this session starts clean."

      - name: Extract video data (repo videos/*.mp4)
        if: steps.check_videos.outputs.count > 0
        run: |
          FPS="${{ inputs.fps || '6' }}"
          SCENE="${{ inputs.scene_detect || 'true' }}"
          THRESH="${{ inputs.scene_threshold || '0.3' }}"
          mkdir -p data
          for video in videos/*.mp4 videos/*.mov; do
            [ -f "$video" ] || continue
            echo "Processing: $video"
            if [ "$SCENE" = "true" ]; then
              python pogo_extract.py --video "$video" --scene-detect --scene-threshold "$THRESH" --fps "$FPS"
            else
              python pogo_extract.py --video "$video" --fps "$FPS"
            fi
          done
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_ONE }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_TWO }}

      - name: Extract video data (Google Drive link)
        if: env.DRIVE_VIDEO_PATH != ''
        run: |
          FPS="${{ inputs.fps || '6' }}"
          SCENE="${{ inputs.scene_detect || 'true' }}"
          THRESH="${{ inputs.scene_threshold || '0.3' }}"
          mkdir -p data
          if [ "$SCENE" = "true" ]; then
            python pogo_extract.py --video "$DRIVE_VIDEO_PATH" --scene-detect --scene-threshold "$THRESH" --fps "$FPS"
          else
            python pogo_extract.py --video "$DRIVE_VIDEO_PATH" --fps "$FPS"
          fi
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_ONE }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_TWO }}

      - name: Commit extracted data
        if: steps.check_videos.outputs.count > 0 || env.DRIVE_VIDEO_PATH != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-extract Pokemon data from video [skip ci]"
            # main can move while this job runs (e.g. a manual upload or the
            # appraisal workflow), so re-apply this run's generated output onto
            # the latest remote rather than rebasing generated JSON, which can
            # only conflict.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::Failed to push extracted data after $attempt attempts"
                exit 1
              fi
              echo "Push rejected (attempt $attempt), re-applying output onto latest main..."
              STAGE=$(mktemp -d)
              cp -r data "$STAGE/data"
              git fetch origin main
              git reset --hard origin/main
              cp -r "$STAGE/data/." data/
              rm -rf "$STAGE"
              git add data/
              if git diff --cached --quiet; then
                echo "Remote already has this output"
                break
              fi
              git commit -m "Auto-extract Pokemon data from video [skip ci]"
            done
          fi
