name: Extract Pokémon Data

on:
  push:
    paths:
      - 'videos/*.mp4'
      - 'videos/*.mov'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytesseract pillow
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg
      
      - name: Extract video data
        run: |
          python pogo_extract.py --video videos/*.mp4 --out data/pokemon.csv --fps 6 --keep-frames || \
          python pogo_extract.py --video videos/*.mov --out data/pokemon.csv --fps 6 --keep-frames
      
      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/pokemon.csv
          git commit -m "Extract Pokémon data from video" || echo "No changes"
          git push
