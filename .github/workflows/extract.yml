name: Extract Pokémon Data

on:
  push:
    paths:
      - 'videos/*.mp4'
      - 'videos/*.mov'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytesseract pillow numpy
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Extract video data
        run: |
          mkdir -p data
          for video in videos/*.mp4 videos/*.mov; do
            [ -e "$video" ] || continue
            echo "Processing $video ..."
            base=$(basename "$video" | sed 's/[^a-zA-Z0-9]/_/g')
            python pogo_extract.py \
              --video "$video" \
              --out "data/pokemon_${base}.csv" \
              --fps 6 \
              --scene-detect \
              --format csv
          done
          # Merge all outputs into single pokemon.csv
          cat data/pokemon_*.csv > data/pokemon.csv 2>/dev/null || true
          rows=$(wc -l < data/pokemon.csv 2>/dev/null || echo 0)
          echo "Total rows in data/pokemon.csv: $rows"

      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          git diff --cached --quiet || git commit -m "Extract Pokémon data from video [skip ci]"
          git push
