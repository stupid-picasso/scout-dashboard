<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Scout Dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#171b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Professor">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  html,body{margin:0;padding:0;width:100%;background:#171b26;color:#e8ecf1;-webkit-tap-highlight-color:transparent}
  a{color:oklch(78% 0.13 220)}
  a:hover{color:oklch(85% 0.13 220)}
</style>
<script src="./src/sample-data.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      reg.update();
      // A new SW taking control means the code just changed under us — reload
      // once so the page runs the fresh deploy instead of the previous one.
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    }).catch(function () {});
  });
}
</script>
</helmet>
<dc-import name="Scout Dashboard" hint-size="100%,100vh" style="display:block;width:100%"></dc-import>
</x-dc>
</body>
</html>
