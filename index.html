document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e,monospace\">SIGN IN<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ signUp }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">CREATE ACCOUNT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:11.5px sans-serif;color:oklch(55% 0.02 260)\">Use the same email/password on every device to sync the same data.<\u002Fdiv>\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:12px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ authError }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCloudUser }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px\">\n          <div style=\"font:12.5px sans-serif;color:oklch(85% 0.02 260)\">Synced as <strong>{{ cloudUserEmail }}<\u002Fstrong> · {{ syncStatusLabel }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <div sc-camel-on-click=\"{{ syncNow }}\" style=\"cursor:pointer;padding:7px 12px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11px ui-monospace,monospace\">SYNC NOW<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ signOutCloud }}\" style=\"cursor:pointer;padding:7px 12px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(80% 0.01 260);font:700 11px ui-monospace,monospace\">SIGN OUT<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isAdminUser }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:1px solid oklch(35% 0.05 200);padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n            <sc-if value=\"{{ showMigrateButton }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:12px sans-serif;color:oklch(65% 0.02 260)\">Move the base-stats table and all 1025 sprites into this Firebase project too — everything as Firestore documents (sprites stored as base64, one doc per dex), so no paid Storage/Blaze plan needed. Admin-only. One-time, ~1025 writes.<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ migrateStatsAndSprites }}\" style=\"cursor:pointer;align-self:flex-start;padding:8px 14px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">MIGRATE STATS + SPRITES TO CLOUD<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ migrationDisplay }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:12px ui-monospace,monospace;color:oklch(75% 0.02 260)\">{{ migrationDisplay.label }}<\u002Fdiv>\n              <div style=\"height:7px;background:oklch(30% 0.02 260);border-radius:4px;overflow:hidden\">\n                <div style=\"height:100%;width:{{ migrationDisplay.pct }}%;background:oklch(65% 0.13 220);transition:width .3s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:oklch(23% 0.03 260);border:1px solid oklch(32% 0.03 260);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n        <div>\n          <div style=\"font:11px ui-monospace,monospace;color:oklch(60% 0.02 260);letter-spacing:.05em;margin-bottom:8px\">STARDUST BALANCE (enter manually)<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <input type=\"text\" placeholder=\"e.g. 1480000\" value=\"{{ stardustDraft }}\" sc-camel-on-change=\"{{ onStardustDraftChange }}\" style=\"display:block;background:transparent;border:none;border-bottom:1px solid oklch(40% 0.03 260);color:oklch(80% 0.15 220);font:800 20px ui-monospace,monospace;padding:4px 0;width:180px\">\n            <div sc-camel-on-click=\"{{ onStardustSave }}\" style=\"cursor:pointer;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace;padding:8px 14px;border-radius:5px;white-space:nowrap\">SAVE<\u002Fdiv>\n            <sc-if value=\"{{ stardustJustSaved }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11px ui-monospace,monospace;color:oklch(78% 0.15 150)\">✓ Saved<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:6px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">DIAGNOSTIC LOG<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n            <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">Every request, HTTP status, error body and batch outcome is recorded on device. Export it and add the file to the repo under <code style=\"font:11.5px ui-monospace,monospace;color:oklch(85% 0.02 260)\">logs/<\u002Fcode> so an import failure can be read off the evidence.<\u002Fdiv>\n            <div style=\"font:11.5px ui-monospace,monospace;color:oklch(70% 0.02 260)\">{{ logCount }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <div sc-camel-on-click=\"{{ shareLog }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SHARE / SAVE LOG<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ copyLog }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">COPY<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ clearLog }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">CLEAR<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ logStatus }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ logStatus }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:6px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">AI ENGINE {{ geminiBadge }}<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n            <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">Screenshot and screen-recording reading use AI vision. Get free keys at <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" style=\"color:oklch(78% 0.13 220)\">aistudio.google.com/apikey<\u002Fa> — no credit card. <strong style=\"color:oklch(85% 0.02 260)\">Paste several, one per line.<\u002Fstrong> Limits are per key, so each one adds 1,500 requests/day and 10 more per minute — with a handful of keys a long recording imports without pausing.<\u002Fdiv>\n            <textarea placeholder=\"AIza…\nAIza…\nAIza…\" value=\"{{ geminiKeyDraft }}\" sc-camel-on-change=\"{{ onGeminiKeyDraftChange }}\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" style=\"width:100%;box-sizing:border-box;min-height:72px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:12px ui-monospace,monospace;resize:vertical\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <div sc-camel-on-click=\"{{ saveGeminiKey }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SAVE KEYS<\u002Fdiv>\n              <sc-if value=\"{{ hasGeminiKey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ clearGeminiKey }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">REMOVE ALL<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ geminiStatusLine }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ geminiStatusLine }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"border-top:1px solid oklch(30% 0.03 260);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260);letter-spacing:.04em\">FALLBACK · GROQ<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ toggleGeminiOnly }}\" style=\"cursor:pointer;padding:6px 11px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 10.5px ui-monospace,monospace;white-space:nowrap\">{{ geminiOnlyLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">Used when Gemini is rate-limited or out of quota. Free key at <a href=\"https://console.groq.com/keys\" target=\"_blank\" style=\"color:oklch(78% 0.13 220)\">console.groq.com/keys<\u002Fa> — 14,400 requests/day, 30 per minute, no card. One key is enough; Groq counts limits per account, so extra keys add nothing.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n                <input type=\"password\" placeholder=\"gsk_…\" value=\"{{ groqKeyDraft }}\" sc-camel-on-change=\"{{ onGroqKeyDraftChange }}\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" style=\"flex:1 1 200px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:12px ui-monospace,monospace\">\n                <div sc-camel-on-click=\"{{ saveGroqKey }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SAVE<\u002Fdiv>\n                <sc-if value=\"{{ hasGroqKey }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div sc-camel-on-click=\"{{ clearGroqKey }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">REMOVE<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasGroqKey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ groqStatusLine }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid oklch(30% 0.03 260);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260);letter-spacing:.04em\">TODAY'S USAGE<\u002Fdiv>\n              <sc-for list=\"{{ aiUsageRows }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:11.5px ui-monospace,monospace\">\n                  <span style=\"color:{{ u.color }}\">{{ u.label }}<\u002Fspan>\n                  <span style=\"color:oklch(80% 0.01 260)\">{{ u.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font:10.5px sans-serif;color:oklch(50% 0.02 260)\">Counts reset at midnight, this device only.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid oklch(30% 0.03 260);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font:600 10.5px ui-monospace,monospace;color:oklch(62% 0.02 260)\">OR A SELF-HOSTED GATEWAY {{ customBadge }}<\u002Fdiv>\n              <div style=\"font:12px sans-serif;color:oklch(70% 0.02 260);line-height:1.55\">Any OpenAI-compatible endpoint — OmniRoute, OpenRouter, Groq. Must be reachable over HTTPS from this device (localhost will not work on your phone).<\u002Fdiv>\n              <input type=\"text\" placeholder=\"https://your-gateway.example.com/v1\" value=\"{{ customBaseDraft }}\" sc-camel-on-change=\"{{ onCustomBaseChange }}\" style=\"background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <input type=\"text\" placeholder=\"model (e.g. auto)\" value=\"{{ customModelDraft }}\" sc-camel-on-change=\"{{ onCustomModelChange }}\" style=\"flex:1 1 130px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace\">\n                <input type=\"password\" placeholder=\"key (optional)\" value=\"{{ customKeyDraft }}\" sc-camel-on-change=\"{{ onCustomKeyChange }}\" style=\"flex:1 1 130px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace\">\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <div sc-camel-on-click=\"{{ saveCustomEndpoint }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SAVE GATEWAY<\u002Fdiv>\n                <sc-if value=\"{{ hasCustomEndpoint }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div sc-camel-on-click=\"{{ clearCustomEndpoint }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">REMOVE<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:6px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">PASTE FROM ANY AI CHAT · FREE<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n            <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">No API key, no limits. Copy the prompt, drop it plus your screenshots into any AI chat (Kimi, Claude, ChatGPT, Gemini), then paste the JSON it returns back here.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ copyImportPrompt }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">{{ copyPromptLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <textarea placeholder=\"Paste the JSON array here…\" value=\"{{ pasteDraft }}\" sc-camel-on-change=\"{{ onPasteDraftChange }}\" style=\"width:100%;box-sizing:border-box;min-height:90px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace;resize:vertical\"><\u002Ftextarea>\n            <div sc-camel-on-click=\"{{ applyPastedImport }}\" style=\"cursor:pointer;align-self:flex-start;padding:9px 16px;border-radius:5px;background:oklch(42% 0.1 150);color:white;font:700 11.5px ui-monospace,monospace\">IMPORT PASTED DATA<\u002Fdiv>\n            <sc-if value=\"{{ pasteError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ pasteError }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pasteSummary }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ pasteSummary }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <label style=\"cursor:pointer;background:oklch(28% 0.03 260);border:1px solid oklch(40% 0.03 260);color:oklch(85% 0.01 260);font:600 12px ui-monospace,monospace;padding:9px 16px;border-radius:5px;white-space:nowrap\">\n            IMPORT SCREENSHOT\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onScreenshotUpload }}\" style=\"display:none\">\n          <\u002Flabel>\n          <label style=\"cursor:pointer;background:oklch(28% 0.05 280);border:1px solid oklch(42% 0.08 280);color:oklch(88% 0.03 280);font:600 12px ui-monospace,monospace;padding:9px 16px;border-radius:5px;white-space:nowrap\">\n            IMPORT SCREEN RECORDING\n            <input type=\"file\" accept=\"video/*\" sc-camel-on-change=\"{{ onVideoUpload }}\" style=\"display:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:11.5px sans-serif;color:oklch(55% 0.02 260)\">Upload a Pokemon detail screenshot to update Stardust, that species' candy/XL candy, and its type — or a screen recording panning your collection/appraise screens to bulk-update or add many Pokemon at once.<\u002Fdiv>\n      <sc-if value=\"{{ importProgressLine }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:oklch(20% 0.03 150);border:1px solid oklch(33% 0.05 150);border-radius:7px;padding:9px 12px\">\n          <div style=\"font:700 10.5px ui-monospace,monospace;color:oklch(72% 0.13 150);letter-spacing:.05em\">IMPORT PROGRESS<\u002Fdiv>\n          <div style=\"font:12px ui-monospace,monospace;color:oklch(86% 0.02 260)\">{{ importProgressLine }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ resetImportProgress }}\" style=\"cursor:pointer;margin-left:auto;font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260);text-decoration:underline\">RESET<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ pendingImport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:oklch(23% 0.045 90);border:1px solid oklch(42% 0.08 90);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 11px ui-monospace,monospace;color:oklch(82% 0.13 90);letter-spacing:.04em\">UNFINISHED IMPORT<\u002Fdiv>\n          <div style=\"font:13px sans-serif;color:oklch(88% 0.02 260);line-height:1.55;text-wrap:pretty\">{{ pendingImport.line }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ resumePendingImport }}\" style=\"cursor:pointer;padding:9px 16px;border-radius:6px;background:oklch(45% 0.13 90);color:oklch(15% 0.02 90);font:700 11.5px ui-monospace,monospace\">RESUME READING<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ discardPendingImport }}\" style=\"cursor:pointer;padding:9px 14px;border-radius:6px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">DISCARD<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ videoEstimate }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:oklch(22% 0.04 250);border:1px solid oklch(40% 0.07 250);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 11px ui-monospace,monospace;color:oklch(80% 0.11 250);letter-spacing:.04em\">BEFORE WE START<\u002Fdiv>\n          <div style=\"font:13px sans-serif;color:oklch(88% 0.02 260);line-height:1.55;text-wrap:pretty\">{{ videoEstimate.line }}<\u002Fdiv>\n          <div style=\"font:11.5px sans-serif;color:oklch(65% 0.02 260);line-height:1.5\">{{ videoEstimate.hint }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ confirmVideoImport }}\" style=\"cursor:pointer;padding:9px 16px;border-radius:6px;background:oklch(45% 0.13 250);color:white;font:700 11.5px ui-monospace,monospace\">START IMPORT<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ cancelVideoEstimate }}\" style=\"cursor:pointer;padding:9px 14px;border-radius:6px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">CANCEL<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCoverage }}\" hint-placeholder-val=\"{{ false }}\">\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:7px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">COVERAGE · {{ coverageHeadline }}<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:10px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n              <sc-for list=\"{{ coverageStats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-direction:column;gap:2px;min-width:96px\">\n                  <div style=\"font:10px ui-monospace,monospace;color:oklch(52% 0.02 260);letter-spacing:.04em\">{{ c.label }}<\u002Fdiv>\n ? window.innerWidth : 1200,\n    showOptimizePlan: false,\n    checklistDate: '',\n    checklistDone: {},\n    chatMessages: [],\n    chatInput: '',\n    chatBusy: false,\n    listening: false,\n    lastQuestion: '',\n    lastAnswer: '',\n    videoImport: null,\n    resources: { rareCandy: null, rareCandyXL: null, eliteFastTM: null, eliteChargedTM: null },\n    resourcesDraft: { rareCandy: '', rareCandyXL: '', eliteFastTM: '', eliteChargedTM: '' },\n    megaEnergyInventory: {},\n    megaNameDraft: '',\n    megaAmountDraft: '',\n    migration: null,\n    migrationAlreadyDone: false,\n    firebaseConfigured: false,\n    firebaseConfigDraft: '',\n    firebaseConfigError: '',\n    authEmail: '',\n    authPassword: '',\n    authError: '',\n    cloudUser: null,\n    syncStatus: ''\n  };\n\n  waitForGlobal(prop, evt) {\n    return new Promise((resolve) => {\n      if (window[prop]) { resolve(window[prop]); return; }\n      const handler = () => { window.removeEventListener(evt, handler); resolve(window[prop]); };\n      window.addEventListener(evt, handler);\n      let tries = 0;\n      const poll = setInterval(() => {\n        if (window[prop] || tries++ > 100) { clearInterval(poll); window.removeEventListener(evt, handler); resolve(window[prop]); }\n      }, 50);\n    });\n  }\n\n  async componentDidMount() {\n    this.bindNetworkStatus();\n    try {\n      // POKEMON_DATA comes from pokemon-data.js, a deferred module. If it never\n      // arrives (missing file — it's gitignored), fall back to the demo sample\n      // so a fresh clone isn't an empty screen.\n      const realData = await this.waitForGlobal('POKEMON_DATA', 'scout-data-ready');\n      const data = (realData && realData.length) ? realData : (window.SAMPLE_POKEMON || []);\n      const mechanics = await this.waitForGlobal('PokemonMechanics', 'scout-mechanics-ready');\n      this.mechanics = mechanics;\n      // Cloud base-stats overlay is applied from onAuthChange (auth isn't ready yet here).\n      // A locally-saved roster (OCR/CSV edits) wins over the bundled export.\n      const savedRoster = this.loadRoster();\n      const wasCleared = localStorage.getItem('scout_roster_cleared_v1') === '1';\n      if (wasCleared) this.setState({ rosterCleared: true });\n      this.setState({ roster: this.sanitizeRoster(savedRoster || (wasCleared ? [] : data) || []), loaded: true });\n    } catch (e) {\n      this.setState({ roster: [], loaded: true });\n    }\n    try {\n      const rawEndpoint = localStorage.getItem('scout_api_endpoint_v1');\n      if (rawEndpoint) this.setState({ apiEndpoint: rawEndpoint, apiEndpointDraft: rawEndpoint });\n    } catch (e) {}\n    try {\n      const multi = localStorage.getItem('scout_gemini_keys_v1');\n      const gk = localStorage.getItem('scout_gemini_key_v1');\n      if (multi) {\n        const arr = JSON.parse(multi);\n        if (Array.isArray(arr) && arr.length) {\n          this.setState({ geminiKeys: arr, geminiKey: arr[0], geminiKeyDraft: arr.join('\\n') });\n        }\n      } else if (gk) {\n        // Migrate the old single-key storage.\n        this.setState({ geminiKeys: [gk], geminiKey: gk, geminiKeyDraft: gk });\n      }\n      const qk = localStorage.getItem('scout_groq_key_v1');\n      if (qk) this.setState({ groqKey: qk, groqKeyDraft: qk });\n      const go = localStorage.getItem('scout_groq_fallback_v1');\n      if (go != null) this.setState({ groqFallback: go !== '0' });\n    } catch (e) {}\n    try {\n      const cb = localStorage.getItem('scout_custom_base_v1');\n      const cm = localStorage.getItem('scout_custom_model_v1');\n      const ck = localStorage.getItem('scout_custom_key_v1');\n      if (cb) this.setState({ customBaseUrl: cb, customBaseDraft: cb });\n      if (cm) this.setState({ customModel: cm, customModelDraft: cm });\n      if (ck) this.setState({ customApiKey: ck, customKeyDraft: ck });\n    } catch (e) {}\n    try {\n      const raw = localStorage.getItem('scout_history_v1');\n      if (raw) this.setState({ history: JSON.parse(raw) });\n    } catch (e) {}\n    try {\n      const rawDone = localStorage.getItem('scout_recommend_done_v1');\n      if (rawDone) this.setState({ completedIds: JSON.parse(rawDone) });\n    } catch (e) {}\n    try {\n      const rawRemoved = localStorage.getItem('scout_removed_v1');\n      if (rawRemoved) this.setState({ removedIds: JSON.parse(rawRemoved) });\n    } catch (e) {}\n    try {\n      const rawDust = localStorage.getItem('scout_stardust_v1');\n      if (rawDust) this.setState({ stardustBalance: JSON.parse(rawDust) });\n      const rawCandy = localStorage.getItem('scout_candy_v1');\n      if (rawCandy) this.setState({ candyInventory: JSON.parse(rawCandy) });\n      const rawTypes = localStorage.getItem('scout_types_v1');\n      if (rawTypes) this.setState({ typeTable: JSON.parse(rawTypes) });\n      const rawOverrides = localStorage.getItem('scout_iv_overrides_v1');\n      if (rawOverrides) this.setState({ ivOverrides: JSON.parse(rawOverrides) });\n      const rawUsage = localStorage.getItem('scout_ai_usage_v1');\n      if (rawUsage) {\n        const u = JSON.parse(rawUsage);\n        // Counters are per-day; a stale day starts fresh.\n        if (u && u.day === this.todayKey()) this.setState({ aiUsage: u });\n      }\n      const rawProg = localStorage.getItem('scout_import_progress_v1');\n      if (rawProg) {\n        const p = JSON.parse(rawProg);\n        if (p && p.day === this.todayKey()) this.setState({ importProgress: p });\n      }\n      const rawAdded = localStorage.getItem('scout_added_v1');\n      if (rawAdded) this.setState({ addedPokemon: JSON.parse(rawAdded) });\n      const rawRes = localStorage.getItem('scout_resources_v1');\n      if (rawRes) this.setState({ resources: JSON.parse(rawRes) });\n      const rawMega = localStorage.getItem('scout_megaenergy_v1');\n      if (rawMega) this.setState({ megaEnergyInventory: JSON.parse(rawMega) });\n    } catch (e) {}\n    try {\n      const today = new Date().toISOString().slice(0, 10);\n      const rawChecklist = localStorage.getItem('scout_checklist_v1');\n      const saved = rawChecklist ? JSON.parse(rawChecklist) : null;\n      if (saved && saved.date === today) {\n        this.setState({ checklistDate: today, checklistDone: saved.done || {} });\n      } else {\n        this.setState({ checklistDate: today, checklistDone: {} });\n      }\n    } catch (e) {}\n    this.updateWidth = () => this.setState({ viewportWidth: window.innerWidth });\n    this.updateWidth();\n    window.addEventListener('resize', this.updateWidth);\n    this.initFirebase();\n    this.checkPendingImport();\n  }\n\n  bindNetworkStatus() {\n    if (this._netBound) return;\n    this._netBound = true;\n    this._onOnline = () => this.setState({ online: true });\n    this._onOffline = () => this.setState({ online: false });\n    window.addEventListener('online', this._onOnline);\n    window.addEventListener('offline', this._onOffline);\n    this.setState({ online: navigator.onLine !== false });\n  }\n\n  componentWillUnmount() {\n    if (this._onOnline) window.removeEventListener('online', this._onOnline);\n    if (this._onOffline) window.removeEventListener('offline', this._onOffline);\n    clearTimeout(this._saveTimer);\n    clearTimeout(this._csvNoticeTimer);\n    clearInterval(this._videoReadingTimer);\n    if (this.updateWidth) window.removeEventListener('resize', this.updateWidth);\n    if (this.resizeObserver) this.resizeObserver.disconnect();\n    if (this._statRaf) cancelAnimationFrame(this._statRaf);\n    if (this._headerIO) this._headerIO.disconnect();\n    clearTimeout(this._frameReleaseTimer);\n  }\n\n  rootRef(el) {\n    if (!el || this.resizeObserver) return;\n    this.resizeObserver = new ResizeObserver((entries) => {\n      const w = entries[0].contentRect.width;\n      if (Math.abs(w - (this.state.viewportWidth || 0)) > 4) this.setState({ viewportWidth: w });\n    });\n    this.resizeObserver.observe(el);\n  }\n\n  SYNC_KEYS() {\n    return ['ros
