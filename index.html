<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
  <script>
  /* Scout import logger — captures fetch/console for import diagnostics. Same-window survives documentElement.replaceWith. */
  (function(){
    if (window.__scoutLog) return;
    var MAXS = 20, IDLE = 45000;
    var cur = null, lastAt = 0, finTimer = null, db = null;

    function now(){ return Date.now(); }
    function hostOf(u){ try { return new URL(u, location.href).host; } catch(e){ return ''; } }
    function engineFor(h, url){
      if (h.indexOf('generativelanguage') >= 0) return 'gemini';
      if (h.indexOf('groq') >= 0) return 'groq';
      if (h.indexOf('firestore') >= 0) return 'firestore';
      if (h.indexOf('firebaseio') >= 0 || h.indexOf('identitytoolkit') >= 0) return 'firebase';
      return h || 'other';
    }
    function isAI(eng, url){
      return eng === 'gemini' || eng === 'groq' || url.indexOf('generateContent') >= 0 || url.indexOf('chat/completions') >= 0;
    }

    function idbOpen(){
      if (db) return Promise.resolve(db);
      return new Promise(function(res, rej){
        var r = indexedDB.open('scout-logs', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('sessions', { keyPath: 'id' }); };
        r.onsuccess = function(){ db = r.result; res(db); };
        r.onerror = function(){ rej(r.error); };
      });
    }
    function idbPut(rec){ return idbOpen().then(function(d){ return new Promise(function(res, rej){ var tx = d.transaction('sessions','readwrite'); tx.objectStore('sessions').put(rec); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
    function idbAll(){ return idbOpen().then(function(d){ return new Promise(function(res, rej){ var tx = d.transaction('sessions','readonly'); var q = tx.objectStore('sessions').getAll(); q.onsuccess = function(){ res(q.result || []); }; q.onerror = function(){ rej(q.error); }; }); }); }
    function idbDel(id){ return idbOpen().then(function(d){ return new Promise(function(res){ var tx = d.transaction('sessions','readwrite'); tx.objectStore('sessions').delete(id); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ res(); }; }); }); }
    function idbTrim(){ return idbAll().then(function(list){ if (list.length <= MAXS) return; list.sort(function(a,b){ return a.startedAt - b.startedAt; }); var drop = list.slice(0, list.length - MAXS); return Promise.all(drop.map(function(s){ return idbDel(s.id); })); }); }

    function newSession(t){
      return { id: 'imp-' + t + '-' + Math.random().toString(36).slice(2,7), startedAt: t, endedAt: null,
        ua: navigator.userAgent, url: location.href, requests: [], consoleLines: [], receipt: null, errors: [], n429: 0 };
    }
    function ensureSession(t){
      if (cur && t - lastAt > IDLE) finalize();
      if (!cur) cur = newSession(t);
      return cur;
    }
    function summarize(s){
      var byEngine = {}, ok = 0, fail = 0, ms = 0, bytes = 0;
      s.requests.forEach(function(r){
        byEngine[r.engine] = (byEngine[r.engine] || 0) + 1;
        if (r.ok) ok++; else fail++;
        ms += r.ms || 0; bytes += r.reqBytes || 0;
      });
      return { totalRequests: s.requests.length, byEngine: byEngine, ok: ok, fail: fail,
        n429: s.n429, totalMs: ms, avgMs: s.requests.length ? Math.round(ms / s.requests.length) : 0,
        reqBytes: bytes, durationMs: (s.endedAt || now()) - s.startedAt,
        errorCount: s.errors.length, hasReceipt: !!s.receipt };
    }
    function worthKeeping(s){ return !!s.receipt || s.requests.length >= 2 || s.errors.length > 0 || s.consoleLines.length > 0; }

    function toCloud(s){
      try {
        var fb = window.firebase;
        if (!fb || !fb.firestore || !fb.auth) return;
        var u = fb.auth().currentUser;
        if (!u) return;
        window.__scoutLog._writing = true;
        var ref = fb.firestore().collection('importLogs').doc(u.uid);
        ref.get().then(function(snap){
          var arr = (snap.exists && snap.data().sessions) || [];
          arr.push(s);
          if (arr.length > MAXS) arr = arr.slice(arr.length - MAXS);
          return ref.set({ sessions: arr, updatedAt: now() }, { merge: true });
        }).catch(function(){}).then(function(){ window.__scoutLog._writing = false; });
      } catch(e){ window.__scoutLog._writing = false; }
    }

    function finalize(){
      if (!cur) return;
      var s = cur; cur = null;
      if (finTimer) { clearTimeout(finTimer); finTimer = null; }
      s.endedAt = now();
      if (!worthKeeping(s)) return;
      s.counts = summarize(s);
      idbPut(s).then(idbTrim).catch(function(){});
      toCloud(s);
    }

    function record(url, host, eng, method, status, ok, ms, reqBytes, error){
      if (window.__scoutLog && window.__scoutLog._writing) return;
      var ai = isAI(eng, url);
      var t = now();
      if (ai) ensureSession(t);
      if (!cur) return;
      lastAt = t;
      cur.requests.push({ t: t, host: host, engine: eng, method: method, status: status, ok: ok, ms: ms, reqBytes: reqBytes, error: error || null });
      if (status === 429) cur.n429++;
      if (error) cur.errors.push({ t: t, where: 'fetch', host: host, msg: error });
    }

    var _fetch = window.fetch;
    window.fetch = function(input, init){
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      var method = (init && init.method) || (input && input.method) || 'GET';
      var host = hostOf(url), eng = engineFor(host, url);
      var reqBytes = 0; try { var b = init && init.body; if (typeof b === 'string') reqBytes = b.length; } catch(e){}
      var t0 = now();
      var p = _fetch.apply(this, arguments);
      try {
        return p.then(function(res){ record(url, host, eng, method, res.status, res.ok, now() - t0, reqBytes, null); return res; },
          function(err){ record(url, host, eng, method, 0, false, now() - t0, reqBytes, (err && err.message) || String(err)); throw err; });
      } catch(e){ return p; }
    };

    ['info','warn','error','log'].forEach(function(fn){
      var orig = console[fn] ? console[fn].bind(console) : function(){};
      console[fn] = function(){
        try {
          var first = arguments.length ? arguments[0] : '';
          if (typeof first === 'string' && first.indexOf('[Scout]') >= 0) {
            var t = now();
            if (first.indexOf('[Scout][receipt]') >= 0) {
              ensureSession(t); lastAt = t;
              var raw = Array.prototype.slice.call(arguments).join(' ');
              var jtxt = raw.slice(raw.indexOf('[Scout][receipt]') + 16).trim();
              try { cur.receipt = JSON.parse(jtxt); } catch(e){ cur.receipt = { raw: jtxt }; }
              if (finTimer) clearTimeout(finTimer);
              finTimer = setTimeout(finalize, 4000);
            } else if (cur) {
              lastAt = t;
              cur.consoleLines.push({ t: t, level: fn, msg: Array.prototype.slice.call(arguments).join(' ') });
            }
          }
        } catch(e){}
        return orig.apply(console, arguments);
      };
    });

    setInterval(function(){ if (cur && now() - lastAt > IDLE) finalize(); }, 5000);
    window.addEventListener('pagehide', finalize);
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') finalize(); });

    function download(){
      return idbAll().then(function(list){
        list.sort(function(a,b){ return a.startedAt - b.startedAt; });
        var payload = { exportedAt: now(), ua: navigator.userAgent, count: list.length, sessions: list };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'import-log-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        return list.length;
      });
    }

    function ensureButton(){
      if (document.getElementById('__scout_log_btn')) return;
      if (!document.body) return;
      var b = document.createElement('button');
      b.id = '__scout_log_btn';
      b.type = 'button';
      b.textContent = 'LOG';
      b.title = 'Download import log JSON';
      b.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:2147483647;font:600 11px -apple-system,sans-serif;color:#8ea0c0;background:rgba(20,24,34,0.72);border:1px solid rgba(120,140,180,0.35);border-radius:8px;padding:5px 9px;opacity:0.55;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)';
      b.onclick = function(){ b.textContent = '...'; download().then(function(n){ b.textContent = n ? 'LOG ' + n : 'EMPTY'; setTimeout(function(){ b.textContent = 'LOG'; }, 1500); }).catch(function(){ b.textContent = 'ERR'; setTimeout(function(){ b.textContent = 'LOG'; }, 1500); }); };
      document.body.appendChild(b);
    }
    setInterval(ensureButton, 3000);
    setTimeout(ensureButton, 1500);

    window.__scoutLog = {
      _writing: false,
      export: download,
      current: function(){ return cur; },
      all: idbAll,
      clear: function(){ return idbAll().then(function(list){ return Promise.all(list.map(function(s){ return idbDel(s.id); })); }); },
      _finalize: finalize
    };
  })();
  </script>
</head>
<body>
  <div id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 200 200"><rect width="200" height="200" fill="#171b26"></rect><circle cx="100" cy="70" r="34" fill="#54c8ff"></circle><rect x="60" y="120" width="80" height="46" rx="10" fill="#3a4258"></rect><text x="100" y="150" font-family="monospace" font-size="20" font-weight="800" fill="#e8ecf5" text-anchor="middle">S</text></svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');

adius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">CREATE ACCOUNT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:11.5px sans-serif;color:oklch(55% 0.02 260)\">Use the same email/password on every device to sync the same data.<\u002Fdiv>\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:12px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ authError }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCloudUser }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px\">\n          <div style=\"font:12.5px sans-serif;color:oklch(85% 0.02 260)\">Synced as <strong>{{ cloudUserEmail }}<\u002Fstrong> · {{ syncStatusLabel }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <div sc-camel-on-click=\"{{ syncNow }}\" style=\"cursor:pointer;padding:7px 12px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11px ui-monospace,monospace\">SYNC NOW<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ signOutCloud }}\" style=\"cursor:pointer;padding:7px 12px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(80% 0.01 260);font:700 11px ui-monospace,monospace\">SIGN OUT<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isAdminUser }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:1px solid oklch(35% 0.05 200);padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n            <sc-if value=\"{{ showMigrateButton }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:12px sans-serif;color:oklch(65% 0.02 260)\">Move the base-stats table and all 1025 sprites into this Firebase project too — everything as Firestore documents (sprites stored as base64, one doc per dex), so no paid Storage/Blaze plan needed. Admin-only. One-time, ~1025 writes.<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ migrateStatsAndSprites }}\" style=\"cursor:pointer;align-self:flex-start;padding:8px 14px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">MIGRATE STATS + SPRITES TO CLOUD<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ migrationDisplay }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:12px ui-monospace,monospace;color:oklch(75% 0.02 260)\">{{ migrationDisplay.label }}<\u002Fdiv>\n              <div style=\"height:7px;background:oklch(30% 0.02 260);border-radius:4px;overflow:hidden\">\n                <div style=\"height:100%;width:{{ migrationDisplay.pct }}%;background:oklch(65% 0.13 220);transition:width .3s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:oklch(23% 0.03 260);border:1px solid oklch(32% 0.03 260);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n        <div>\n          <div style=\"font:11px ui-monospace,monospace;color:oklch(60% 0.02 260);letter-spacing:.05em;margin-bottom:8px\">STARDUST BALANCE (enter manually)<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <input type=\"text\" placeholder=\"e.g. 1480000\" value=\"{{ stardustDraft }}\" sc-camel-on-change=\"{{ onStardustDraftChange }}\" style=\"display:block;background:transparent;border:none;border-bottom:1px solid oklch(40% 0.03 260);color:oklch(80% 0.15 220);font:800 20px ui-monospace,monospace;padding:4px 0;width:180px\">\n            <div sc-camel-on-click=\"{{ onStardustSave }}\" style=\"cursor:pointer;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace;padding:8px 14px;border-radius:5px;white-space:nowrap\">SAVE<\u002Fdiv>\n            <sc-if value=\"{{ stardustJustSaved }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11px ui-monospace,monospace;color:oklch(78% 0.15 150)\">✓ Saved<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:6px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">AI ENGINE {{ geminiBadge }}<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n            <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">Screenshot and screen-recording reading use AI vision. Get free keys at <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" style=\"color:oklch(78% 0.13 220)\">aistudio.google.com/apikey<\u002Fa> — no credit card. <strong style=\"color:oklch(85% 0.02 260)\">Paste several, one per line.<\u002Fstrong> Limits are per key, so each one adds 1,500 requests/day and 10 more per minute — with a handful of keys a long recording imports without pausing.<\u002Fdiv>\n            <textarea placeholder=\"AIza…\nAIza…\nAIza…\" value=\"{{ geminiKeyDraft }}\" sc-camel-on-change=\"{{ onGeminiKeyDraftChange }}\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" style=\"width:100%;box-sizing:border-box;min-height:72px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:12px ui-monospace,monospace;resize:vertical\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <div sc-camel-on-click=\"{{ saveGeminiKey }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SAVE KEYS<\u002Fdiv>\n              <sc-if value=\"{{ hasGeminiKey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ clearGeminiKey }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">REMOVE ALL<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ geminiStatusLine }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ geminiStatusLine }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"border-top:1px solid oklch(30% 0.03 260);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260);letter-spacing:.04em\">FALLBACK · GROQ<\u002Fdiv>\n              <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">Used when Gemini is rate-limited or out of quota. Free key at <a href=\"https://console.groq.com/keys\" target=\"_blank\" style=\"color:oklch(78% 0.13 220)\">console.groq.com/keys<\u002Fa> — 14,400 requests/day, 30 per minute, no card. One key is enough; Groq counts limits per account, so extra keys add nothing.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n                <input type=\"password\" placeholder=\"gsk_…\" value=\"{{ groqKeyDraft }}\" sc-camel-on-change=\"{{ onGroqKeyDraftChange }}\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" style=\"flex:1 1 200px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:12px ui-monospace,monospace\">\n                <div sc-camel-on-click=\"{{ saveGroqKey }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SAVE<\u002Fdiv>\n                <sc-if value=\"{{ hasGroqKey }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div sc-camel-on-click=\"{{ clearGroqKey }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">REMOVE<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasGroqKey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">Groq fallback active — 14,400 requests/day.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid oklch(30% 0.03 260);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260);letter-spacing:.04em\">TODAY'S USAGE<\u002Fdiv>\n              <sc-for list=\"{{ aiUsageRows }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:11.5px ui-monospace,monospace\">\n                  <span style=\"color:{{ u.color }}\">{{ u.label }}<\u002Fspan>\n                  <span style=\"color:oklch(80% 0.01 260)\">{{ u.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font:10.5px sans-serif;color:oklch(50% 0.02 260)\">Counts reset at midnight, this device only.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid oklch(30% 0.03 260);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font:600 10.5px ui-monospace,monospace;color:oklch(62% 0.02 260)\">OR A SELF-HOSTED GATEWAY {{ customBadge }}<\u002Fdiv>\n              <div style=\"font:12px sans-serif;color:oklch(70% 0.02 260);line-height:1.55\">Any OpenAI-compatible endpoint — OmniRoute, OpenRouter, Groq. Must be reachable over HTTPS from this device (localhost will not work on your phone).<\u002Fdiv>\n              <input type=\"text\" placeholder=\"https://your-gateway.example.com/v1\" value=\"{{ customBaseDraft }}\" sc-camel-on-change=\"{{ onCustomBaseChange }}\" style=\"background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <input type=\"text\" placeholder=\"model (e.g. auto)\" value=\"{{ customModelDraft }}\" sc-camel-on-change=\"{{ onCustomModelChange }}\" style=\"flex:1 1 130px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace\">\n                <input type=\"password\" placeholder=\"key (optional)\" value=\"{{ customKeyDraft }}\" sc-camel-on-change=\"{{ onCustomKeyChange }}\" style=\"flex:1 1 130px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace\">\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <div sc-camel-on-click=\"{{ saveCustomEndpoint }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">SAVE GATEWAY<\u002Fdiv>\n                <sc-if value=\"{{ hasCustomEndpoint }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div sc-camel-on-click=\"{{ clearCustomEndpoint }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(28% 0.03 260);color:oklch(80% 0.01 260);font:700 11.5px ui-monospace,monospace\">REMOVE<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:6px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">SERVER-SIDE VIDEO IMPORT · FREE<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n            <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">Run the \"Extract Pokemon Data\" GitHub Actions workflow with your recording's Google Drive link, then tap below to pull the result straight in — no copy/paste needed.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ importFromServer }}\" style=\"cursor:pointer;padding:9px 16px;border-radius:5px;background:oklch(42% 0.1 150);color:white;font:700 11.5px ui-monospace,monospace\">{{ serverImportLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ serverImportError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ serverImportError }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ serverImportSummary }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ serverImportSummary }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:6px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">PASTE FROM ANY AI CHAT · FREE<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n            <div style=\"font:12px sans-serif;color:oklch(72% 0.02 260);line-height:1.55\">No API key, no limits. Copy the prompt, drop it plus your screenshots into any AI chat (Kimi, Claude, ChatGPT, Gemini), then paste the JSON it returns back here.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ copyImportPrompt }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">{{ copyPromptLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <textarea placeholder=\"Paste the JSON array here…\" value=\"{{ pasteDraft }}\" sc-camel-on-change=\"{{ onPasteDraftChange }}\" style=\"width:100%;box-sizing:border-box;min-height:90px;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:8px 10px;border-radius:5px;font:11.5px ui-monospace,monospace;resize:vertical\"><\u002Ftextarea>\n            <div sc-camel-on-click=\"{{ applyPastedImport }}\" style=\"cursor:pointer;align-self:flex-start;padding:9px 16px;border-radius:5px;background:oklch(42% 0.1 150);color:white;font:700 11.5px ui-monospace,monospace\">IMPORT PASTED DATA<\u002Fdiv>\n            <sc-if value=\"{{ pasteError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ pasteError }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pasteSummary }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px ui-monospace,monospace;color:oklch(72% 0.13 150)\">{{ pasteSummary }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <label style=\"cursor:pointer;background:oklch(28% 0.03 260);border:1px solid oklch(40% 0.03 260);color:oklch(85% 0.01 260);font:600 12px ui-monospace,monospace;padding:9px 16px;border-radius:5px;white-space:nowrap\">\n            IMPORT SCREENSHOT\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onScreenshotUpload }}\" style=\"display:none\">\n          <\u002Flabel>\n          <label style=\"cursor:pointer;background:oklch(28% 0.05 280);border:1px solid oklch(42% 0.08 280);color:oklch(88% 0.03 280);font:600 12px ui-monospace,monospace;padding:9px 16px;border-radius:5px;white-space:nowrap\">\n            IMPORT SCREEN RECORDING\n            <input type=\"file\" accept=\"video/*\" sc-camel-on-change=\"{{ onVideoUpload }}\" style=\"display:none\">\n          <\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:11.5px sans-serif;color:oklch(55% 0.02 260)\">Upload a Pokemon detail screenshot to update Stardust, that species' candy/XL candy, and its type — or a screen recording panning your collection/appraise screens to bulk-update or add many Pokemon at once.<\u002Fdiv>\n      <sc-if value=\"{{ importProgressLine }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:oklch(20% 0.03 150);border:1px solid oklch(33% 0.05 150);border-radius:7px;padding:9px 12px\">\n          <div style=\"font:700 10.5px ui-monospace,monospace;color:oklch(72% 0.13 150);letter-spacing:.05em\">IMPORT PROGRESS<\u002Fdiv>\n          <div style=\"font:12px ui-monospace,monospace;color:oklch(86% 0.02 260)\">{{ importProgressLine }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ resetImportProgress }}\" style=\"cursor:pointer;margin-left:auto;font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260);text-decoration:underline\">RESET<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ pendingImport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:oklch(23% 0.045 90);border:1px solid oklch(42% 0.08 90);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 11px ui-monospace,monospace;color:oklch(82% 0.13 90);letter-spacing:.04em\">UNFINISHED IMPORT<\u002Fdiv>\n          <div style=\"font:13px sans-serif;color:oklch(88% 0.02 260);line-height:1.55;text-wrap:pretty\">{{ pendingImport.line }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ resumePendingImport }}\" style=\"cursor:pointer;padding:9px 16px;border-radius:6px;background:oklch(45% 0.13 90);color:oklch(15% 0.02 90);font:700 11.5px ui-monospace,monospace\">RESUME READING<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ discardPendingImport }}\" style=\"cursor:pointer;padding:9px 14px;border-radius:6px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">DISCARD<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ videoEstimate }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:oklch(22% 0.04 250);border:1px solid oklch(40% 0.07 250);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font:700 11px ui-monospace,monospace;color:oklch(80% 0.11 250);letter-spacing:.04em\">BEFORE WE START<\u002Fdiv>\n          <div style=\"font:13px sans-serif;color:oklch(88% 0.02 260);line-height:1.55;text-wrap:pretty\">{{ videoEstimate.line }}<\u002Fdiv>\n          <div style=\"font:11.5px sans-serif;color:oklch(65% 0.02 260);line-height:1.5\">{{ videoEstimate.hint }}<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div sc-camel-on-click=\"{{ confirmVideoImport }}\" style=\"cursor:pointer;padding:9px 16px;border-radius:6px;background:oklch(45% 0.13 250);color:white;font:700 11.5px ui-monospace,monospace\">START IMPORT<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ cancelVideoEstimate }}\" style=\"cursor:pointer;padding:9px 14px;border-radius:6px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">CANCEL<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCoverage }}\" hint-placeholder-val=\"{{ false }}\">\n        <details style=\"background:oklch(19% 0.02 260);border:1px solid oklch(32% 0.03 260);border-radius:7px;padding:8px 12px\">\n          <summary style=\"cursor:pointer;font:600 11px ui-monospace,monospace;color:oklch(68% 0.02 260);list-style:none\">COVERAGE · {{ coverageHeadline }}<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:10px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n              <sc-for list=\"{{ coverageStats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-direction:column;gap:2px;min-width:96px\">\n                  <div style=\"font:10px ui-monospace,monospace;color:oklch(52% 0.02 260);letter-spacing:.04em\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font:600 15px ui-monospace,monospace;color:{{ c.color }}\">{{ c.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ coverageGapLine }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11.5px sans-serif;color:oklch(70% 0.02 260);line-height:1.5;text-wrap:pretty\">{{ coverageGapLine }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasStaleList }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:11px sans-serif;color:oklch(72% 0.11 70);line-height:1.5;text-wrap:pretty\">{{ staleLine }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-if>\n      <div style=\"border-top:1px solid oklch(28% 0.03 260);margin-top:2px;padding-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n        <sc-if value=\"{{ clearArmed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:11.5px ui-monospace,monospace;color:oklch(78% 0.15 40)\">{{ clearWarning }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ confirmClearRoster }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:oklch(45% 0.16 30);color:white;font:700 11.5px ui-monospace,monospace\">YES, DELETE ALL<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ cancelClearRoster }}\" style=\"cursor:pointer;padding:8px 12px;border-radius:5px;background:oklch(30% 0.03 260);color:oklch(85% 0.01 260);font:700 11.5px ui-monospace,monospace\">CANCEL<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ clearNotArmed }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-click=\"{{ armClearRoster }}\" style=\"cursor:pointer;padding:8px 14px;border-radius:5px;background:transparent;border:1px solid oklch(42% 0.08 30);color:oklch(72% 0.11 30);font:700 11.5px ui-monospace,monospace\" style-hover=\"background:oklch(26% 0.05 30);color:oklch(84% 0.13 30)\">CLEAR ROSTER<\u002Fdiv>\n          <div style=\"font:11px sans-serif;color:oklch(50% 0.02 260)\">Wipes every Pokemon and all candy/XL counts before a fresh import. Stardust, resources and settings are kept.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasVideoImport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:oklch(19% 0.03 280);border:1px solid oklch(38% 0.06 280);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\">\n            <div style=\"font:700 12px ui-monospace,monospace;color:oklch(85% 0.08 280)\">SCREEN RECORDING IMPORT<\u002Fdiv>\n            <sc-if value=\"{{ videoImportDismissable }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ dismissVideoImport }}\" style=\"cursor:pointer;font:11px ui-monospace,monospace;color:oklch(60% 0.02 260)\">× close<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-for list=\"{{ videoImportSteps }}\" as=\"step\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <div style=\"font:12px ui-monospace,monospace;color:{{ step.labelColor }}\">{{ step.label }}<\u002Fdiv>\n              <div style=\"height:8px;border-radius:4px;background:oklch(28% 0.02 260);overflow:hidden\">\n                <div style=\"height:100%;width:{{ step.pct }}%;background:{{ step.barColor }};transition:width .3s ease\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ videoImportError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:12px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ videoImportError }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ retryVideoImport }}\" style=\"cursor:pointer;align-self:flex-start;padding:8px 14px;border-radius:5px;background:oklch(45% 0.1 220);color:white;font:700 11.5px ui-monospace,monospace\">RETRY<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasVideoReview }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\">\n                <div style=\"font:700 12px ui-monospace,monospace;color:oklch(85% 0.08 280)\">WHAT WAS IMPORTED<\u002Fdiv>\n                <div style=\"font:11px ui-monospace,monospace;color:oklch(62% 0.02 260)\">{{ reviewCountLine }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid oklch(32% 0.04 280);border-radius:7px;overflow:hidden\">\n                <div style=\"display:grid;grid-template-columns:1.7fr .7fr .6fr .9fr .8fr;gap:8px;padding:8px 10px;background:oklch(24% 0.04 280);font:700 9.5px ui-monospace,monospace;color:oklch(66% 0.03 280);letter-spacing:.05em\">\n                  <div>NAME<\u002Fdiv><div>CP<\u002Fdiv><div>HP<\u002Fdiv><div>IV<\u002Fdiv><div>CANDY<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ videoReviewRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:1.7fr .7fr .6fr .9fr .8fr;gap:8px;padding:9px 10px;border-top:1px solid oklch(27% 0.03 280);align-items:center;background:{{ r.rowBg }}\">\n                    <div style=\"min-width:0\">\n                      <div style=\"font:600 12px sans-serif;color:oklch(92% 0.01 260);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font:9.5px ui-monospace,monospace;color:{{ r.tagColor }};letter-spacing:.04em\">{{ r.tag }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font:12px ui-monospace,monospace;color:oklch(84% 0.01 260)\">{{ r.cp }}<\u002Fdiv>\n                    <div style=\"font:12px ui-monospace,monospace;color:oklch(70% 0.02 260)\">{{ r.hp }}<\u002Fdiv>\n                    <div style=\"font:11.5px ui-monospace,monospace;color:{{ r.ivColor }}\">{{ r.iv }}<\u002Fdiv>\n                    <div style=\"font:11.5px ui-monospace,monospace;color:oklch(70% 0.02 260)\">{{ r.candy }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font:11px sans-serif;color:oklch(55% 0.02 260);line-height:1.5\">Anything read wrong can be fixed by tapping that Pokemon in the roster, or by re-importing a clearer clip — a re-import updates rather than duplicates.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ videoImportSummary }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:13px sans-serif;color:oklch(90% 0.02 280)\">Done! Updated {{ videoImportSummary.updated }}, added {{ videoImportSummary.inserted }} new, from {{ videoImportSummary.total }} Pokemon read off the recording.<\u002Fdiv>\n            <sc-if value=\"{{ videoPartialWarning }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:oklch(22% 0.045 70);border:1px solid oklch(40% 0.07 70);border-radius:7px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font:12px ui-monospace,monospace;color:oklch(82% 0.13 70);line-height:1.5;text-wrap:pretty\">{{ videoPartialWarning }}<\u002Fdiv>\n                <sc-if value=\"{{ canRetryVideo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div sc-camel-on-click=\"{{ retryVideoImport }}\" style=\"cursor:pointer;align-self:flex-start;padding:8px 16px;border-radius:5px;background:oklch(48% 0.13 70);color:oklch(15% 0.02 70);font:700 11.5px ui-monospace,monospace\" style-hover=\"background:oklch(56% 0.14 70)\">RETRY FAILED BATCHES<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ videoFrameThumbs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">{{ videoFrameLabel }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ videoFrameThumbs }}\" as=\"thumb\" hint-placeholder-count=\"0\">\n                  <img ref=\"{{ thumb.ref }}\" style=\"width:76px;height:56px;object-fit:cover;border-radius:4px;border:1px solid oklch(35% 0.04 280);background:oklch(15% 0.01 260)\">\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ videoRawReply }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">CLAUDE'S RAW REPLY<\u002Fdiv>\n              <div style=\"font:11px ui-monospace,monospace;color:oklch(70% 0.02 260);background:oklch(15% 0.01 260);padding:8px;border-radius:5px;white-space:pre-wrap;max-height:140px;overflow-y:auto\">{{ videoRawReply }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ ocrBusy }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <div style=\"position:relative;width:52px;height:74px;border-radius:6px;overflow:hidden;background:oklch(24% 0.03 260);border:1px solid oklch(36% 0.04 220);flex-shrink:0\">\n            <div style=\"position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,oklch(82% 0.15 220),transparent);box-shadow:0 0 10px oklch(75% 0.15 220);animation:scanSweep 1.5s ease-in-out infinite\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <div aria-live=\"polite\" style=\"font:12px ui-monospace,monospace;color:oklch(78% 0.13 220)\">Reading screenshot…<\u002Fdiv>\n            <div style=\"font:11px sans-serif;color:oklch(55% 0.02 260)\">Extracting name, CP, HP, candy and moves.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ ocrError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font:12px ui-monospace,monospace;color:oklch(75% 0.15 30)\">{{ ocrError }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasOcrParsed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:oklch(19% 0.025 220);border:1px solid oklch(35% 0.05 220);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font:11px ui-monospace,monospace;color:oklch(70% 0.13 220)\">{{ ocrParsedDisplay.matchLine }}<\u002Fdiv>\n          <sc-if value=\"{{ ocrParsedDisplay.readerLine }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:11px ui-monospace,monospace;color:oklch(78% 0.15 70)\">{{ ocrParsedDisplay.readerLine }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">NAME<\u002Fdiv><input type=\"text\" value=\"{{ ocrParsedDisplay.name }}\" sc-camel-on-change=\"{{ onOcrName }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">CP<\u002Fdiv><input type=\"number\" value=\"{{ ocrParsedDisplay.cp }}\" sc-camel-on-change=\"{{ onOcrCp }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">HP<\u002Fdiv><input type=\"number\" value=\"{{ ocrParsedDisplay.hp }}\" sc-camel-on-change=\"{{ onOcrHp }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">TYPE<\u002Fdiv><input type=\"text\" value=\"{{ ocrParsedDisplay.type }}\" sc-camel-on-change=\"{{ onOcrType }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">CANDY<\u002Fdiv><input type=\"number\" value=\"{{ ocrParsedDisplay.candy }}\" sc-camel-on-change=\"{{ onOcrCandy }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">XL CANDY<\u002Fdiv><input type=\"number\" value=\"{{ ocrParsedDisplay.xlCandy }}\" sc-camel-on-change=\"{{ onOcrXl }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div style=\"grid-column:1 / -1\"><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">STARDUST BALANCE<\u002Fdiv><input type=\"number\" value=\"{{ ocrParsedDisplay.stardust }}\" sc-camel-on-change=\"{{ onOcrStardust }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">WEIGHT<\u002Fdiv><input type=\"text\" value=\"{{ ocrParsedDisplay.weight }}\" sc-camel-on-change=\"{{ onOcrWeight }}\" style=\"width:100%;box-sizing:border-box;background:oklch(23% 0.03 260);border:1px solid oklch(38% 0.03 260);color:oklch(92% 0.01 260);padding:6px 8px;border-radius:5px;font:13px sans-serif\"><\u002Fdiv>\n            <div><div style=\"font:10.5px ui-monospace,monospace;color:oklch(55% 0.02 260)\">HEIGHT<\u002Fdiv><input type=\"text\" value=\"{{ ocrParsedDisplay.height }}\" sc-camel-on-change=\"{{ onOcrHeight }}\" style=\"width:100%;box-sizing:border-box   stardustBalance: null,\n    candyInventory: {},\n    typeTable: {},\n    online: true,\n    storageWarning: '',\n    csvNotice: '',\n    csvError: '',\n    ocrBusy: false,\n    ocrError: '',\n    ocrPreview: null,\n    ocrParsed: null,\n    aiUsage: { day: '' },\n    importProgress: { day: '', clips: 0, added: 0, updated: 0 },\n    clearArmed: false,\n    rosterCleared: false,\n    ivOverrides: {},\n    addedPokemon: [],\n    solvedIvResult: null,\n    videoEstimate: null,\n    csvExported: false,\n    pendingImport: null,\n    apprStars: null,\n    apprMaxed: [],\n    apprMaxedKnown: false,\n    ocrHp: '',\n    apiEndpoint: '',\n    apiEndpointDraft: '',\n    geminiKey: '',\n    geminiKeys: [],\n    geminiKeyDraft: '',\n    groqKey: '',\n    groqKeyDraft: '',\n    customBaseUrl: '',\n    customModel: '',\n    customApiKey: '',\n    customBaseDraft: '',\n    customModelDraft: '',\n    customKeyDraft: '',\n    pasteDraft: '',\n    pasteError: '',\n    pasteSummary: '',\n    promptCopied: false,\n    viewportWidth: typeof window !== 'undefined' ? window.innerWidth : 1200,\n    showOptimizePlan: false,\n    checklistDate: '',\n    checklistDone: {},\n    chatMessages: [],\n    chatInput: '',\n    chatBusy: false,\n    listening: false,\n    lastQuestion: '',\n    lastAnswer: '',\n    videoImport: null,\n    resources: { rareCandy: null, rareCandyXL: null, eliteFastTM: null, eliteChargedTM: null },\n    resourcesDraft: { rareCandy: '', rareCandyXL: '', eliteFastTM: '', eliteChargedTM: '' },\n    megaEnergyInventory: {},\n    megaNameDraft: '',\n    megaAmountDraft: '',\n    migration: null,\n    migrationAlreadyDone: false,\n    firebaseConfigured: false,\n    firebaseConfigDraft: '',\n    firebaseConfigError: '',\n    authEmail: '',\n    authPassword: '',\n    authError: '',\n    cloudUser: null,\n    syncStatus: ''\n  };\n\n  waitForGlobal(prop, evt) {\n    return new Promise((resolve) => {\n      if (window[prop]) { resolve(window[prop]); return; }\n      const handler = () => { window.removeEventListener(evt, handler); resolve(window[prop]); };\n      window.addEventListener(evt, handler);\n      let tries = 0;\n      const poll = setInterval(() => {\n        if (window[prop] || tries++ > 100) { clearInterval(poll); window.removeEventListener(evt, handler); resolve(window[prop]); }\n      }, 50);\n    });\n  }\n\n  async componentDidMount() {\n    this.bindNetworkStatus();\n    try {\n      // POKEMON_DATA comes from pokemon-data.js, a deferred module. If it never\n      // arrives (missing file — it's gitignored), fall back to the demo sample\n      // so a fresh clone isn't an empty screen.\n      const realData = await this.waitForGlobal('POKEMON_DATA', 'scout-data-ready');\n      const data = (realData && realData.length) ? realData : (window.SAMPLE_POKEMON || []);\n      const mechanics = await this.waitForGlobal('PokemonMechanics', 'scout-mechanics-ready');\n      this.mechanics = mechanics;\n      // Cloud base-stats overlay is applied from onAuthChange (auth isn't ready yet here).\n      // A locally-saved roster (OCR/CSV edits) wins over the bundled export.\n      const savedRoster = this.loadRoster();\n      const wasCleared = localStorage.getItem('scout_roster_cleared_v1') === '1';\n      if (wasCleared) this.setState({ rosterCleared: true });\n      this.setState({ roster: this.sanitizeRoster(savedRoster || (wasCleared ? [] : data) || []), loaded: true });\n    } catch (e) {\n      this.setState({ roster: [], loaded: true });\n    }\n    try {\n      const rawEndpoint = localStorage.getItem('scout_api_endpoint_v1');\n      if (rawEndpoint) this.setState({ apiEndpoint: rawEndpoint, apiEndpointDraft: rawEndpoint });\n    } catch (e) {}\n    try {\n      const multi = localStorage.getItem('scout_gemini_keys_v1');\n      const gk = localStorage.getItem('scout_gemini_key_v1');\n      if (multi) {\n        const arr = JSON.parse(multi);\n        if (Array.isArray(arr) && arr.length) {\n          this.setState({ geminiK indow.removeEventListener('online', this._onOnline);\n    if (this._onOffline) window.removeEventListener('offline', this._onOffline);\n    clearTimeout(this._saveTimer);\n    clearTimeout(this._csvNoticeTimer);\n    clearInterval(this._videoReadingTimer);\n    if (this.updateWidth) window.removeEventListener('resize', this.updateWidth);\n    if (this.resizeObserver) this.resizeObserver.disconnect();\n    if (this._statRaf) cancelAnimationFrame(this._statRaf);\n    if (this._headerIO) this._headerIO.disconnect();\n    clearTimeout(this._frameReleaseTimer);\n  }\n\n  rootRef(el) {\n    if (!el || this.resizeObserver) return;\n    this.resizeObserver = new ResizeObserver((entries) => {\n      const w = entries[0].contentRect.width;\n      if (Math.abs(w - (this.state.viewportWidth || 0)) > 4) this.setState({ viewportWidth: w });\n    });\n    this.resizeObserver.observe(el);\n  }\n\n  SYNC_KEYS() {\n    return ['roster', 'ivOverrides', 'addedPokemon', 'candyInventory', 'typeTable', 'stardustBalance', 'history', 'completedIds', 'removedIds', 'checklistDate', 'checklistDone', 'resources', 'megaEnergyInventory', 'geminiKey', 'geminiKeys', 'groqKey'];\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    // Persist the roster locally whenever it changes (OCR, CSV, video, transfers).\n    // Single choke point so every mutation path survives a reload.\n    // Identity check first: serialising 300+ Pokemon on every render (hover,\n    // filter keystroke, stat tick) was costing milliseconds per frame for a\n    // value that only changes on an actual mutation.\n    if (this.state.loaded && this.state.roster && this._lastRosterRef !== this.state.roster) {\n      this._lastRosterRef = this.state.roster;\n      const rosterSig = JSON.stringify(this.state.roster);\n      if (this._lastRosterSig !== undefined && rosterSig !== this._lastRosterSig) {\n        this.queueSaveRoster(this.state.roster);\n      }\n      this._lastRosterSig = rosterSig;\n    }\n    if (this._applyin
