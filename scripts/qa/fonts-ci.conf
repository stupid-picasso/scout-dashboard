<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Makes a dev box render like the GitHub runner, which has no Inter: system-ui falls back to DejaVu Sans, which is wider.
     Use:  FONTCONFIG_FILE=$PWD/scripts/qa/fonts-ci.conf node scripts/qa/qa_run.js e
     Layout tests (UIQ-09, UIQ-15, UIQ-17, UIQ-28) must hold with these fonts. Adjust the globs to the fonts your box has extra. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/opentype/inter/*</glob>
      <glob>/usr/share/fonts/truetype/jetbrains-mono/*</glob>
      <glob>/usr/share/fonts/truetype/crosextra/*</glob>
      <glob>/usr/share/fonts/truetype/libreoffice/*</glob>
      <glob>/usr/share/fonts/opentype/tlwg/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
